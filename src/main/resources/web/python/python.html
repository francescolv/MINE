<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MINE · Python</title>
<link rel="stylesheet" href="editor/editor.css">
<link rel="stylesheet" href="codemirror/codemirror.css">
<link rel="stylesheet" href="python/python.css">
</head>
<body>
<header>
	<strong class="brand">MINE</strong>
	<span class="kind">Python</span>
	<span id="who"></span>
	<select id="programs" aria-label="My programs"></select>
	<label class="name"><span id="name-label"></span> <input id="name" maxlength="24" spellcheck="false"></label>
	<button id="save"></button>
	<button id="run" class="primary"></button>
	<button id="stop" disabled></button>
	<a id="to-blocks" class="button-link" href="./"></a>
	<button id="thonny"></button>
	<select id="students" aria-label="Students' programs" hidden></select>
	<span id="status" role="status"></span>
	<div id="viewing" hidden><span id="viewing-text"></span> <button id="copy"></button> <button id="back"></button></div>
</header>
<section id="lesson" hidden>
	<div class="lesson-line">
		<strong id="lesson-title"></strong>
		<span id="lesson-step"></span>
		<span id="lesson-goal"></span>
		<button id="hint"></button>
	</div>
	<ol id="lesson-hints" aria-live="polite"></ol>
</section>
<main class="python">
	<div id="editor"></div>
	<section id="output-pane">
		<div class="output-head"><h2 id="output-title"></h2><span id="timing"></span></div>
		<pre id="output" aria-live="polite"></pre>
	</section>
</main>
<dialog id="thonny-dialog">
	<h2 id="thonny-title"></h2>
	<ol id="thonny-steps"></ol>
	<p class="thonny-code"><span id="thonny-code-label"></span> <strong id="thonny-code"></strong></p>
	<div class="thonny-buttons">
		<a id="thonny-download" class="button-link primary" href="python/thonny/mine.py" download="mine.py"></a>
		<button id="thonny-close"></button>
	</div>
</dialog>
<div id="expired" hidden></div>
<script src="codemirror/codemirror.js"></script>
<script src="codemirror/mode-python.js"></script>
<script src="codemirror/matchbrackets.js"></script>
<script src="codemirror/closebrackets.js"></script>
<script src="python/python.js"></script>
</body>
</html>
