name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # A fixed Ubuntu, not ubuntu-latest: the build doesn't change system on its own,
    # we move to a newer one when we decide to.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build modpack serverPack

      - name: Lessons with blocks are up to date
        run: node tools/blocks-to-lua.js --check

      - name: Run GameTests
        run: ./gradlew runGametest

      - name: Upload GameTest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-report
          path: build/gametest/junit.xml

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mine-jar
          path: build/libs/*.jar

      # For schools: the modpack for the lab PCs and the server package (docs/guide/server.md)
      - name: Upload modpack and server package
        uses: actions/upload-artifact@v7
        with:
          name: mine-for-schools
          path: build/distributions/*
